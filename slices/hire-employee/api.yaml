# hire-employee ⑤ API（OpenAPI 3.1）
openapi: 3.1.0
info:
  title: hire-employee API
  version: 0.1.0
  description: 依 slices/hire-employee/05_mapping.md（對照表經使用者確認 2026-10-14）產生的設計文件，不是實作。每支 API 標 x-concept（對應的概念，P8）、x-roles（誰可以做）、x-rules（檢查的規則）。所有 API 都在一個多文件交易中寫入 events 與受影響的集合，並檢查每個引用屬於呼叫者的客戶、存在且為目前版本（05_mapping
    D-06）。由時間或條件觸發的事件（ContractTermStarts、VoidContract、ExpireWorkAuthorization、ExpireIdentityDocument、LapseWarningOverride，以及建議層事件的產生）沒有 API，由系統排程或事件處理器產生。
servers:
- url: https://{host}
  variables:
    host:
      default: hr.example.local
security:
- bearer: []
paths:
  /v1/hires:
    post:
      operationId: decideHire
      summary: 決定錄用（同一交易建立人；可帶約定薪資、勞動契約）
      x-concept: DecideHire
      x-roles:
      - HR
      responses:
        '201':
          description: 成功；檢查規則為「提醒」的違反會在 warnings 回傳
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Blocked'
      x-rules:
      - R11
      - R14
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                person: &id003
                  type: object
                employer_id: &id002
                  type: string
                decided_on: &id001
                  type: string
                  format: date
                planned_start_date: *id001
                planned_work_location_id: *id002
                planned_org_unit_id: *id002
                prior_insurance_elsewhere: *id002
                occurred_at:
                  type: string
                  format: date-time
                  description: 現實中何時發生（P4）
