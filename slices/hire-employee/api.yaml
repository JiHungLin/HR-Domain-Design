# hire-employee ⑤ API（OpenAPI 3.1）
openapi: 3.1.0
info:
  title: hire-employee API
  version: 0.4.0
  description: 依 slices/hire-employee/05_mapping.md 產生的設計文件，不是實作。請求與回應寫到欄位層級（必填、巢狀物件）；同一個動作建立的每個項目，回應都給編號。每支 API 標 x-concept（概念，P8）、x-roles（誰可以做）、x-rules（檢查的規則）。所有 API 在一個多文件交易中寫入 events 與受影響的集合，並檢查每個引用屬於呼叫者的客戶、存在且為目前版本（05_mapping D-06）。由時間或條件觸發的事件沒有 API，由系統排程或事件處理器產生。
servers:
- url: https://{host}
  variables:
    host:
      default: hr.example.local
security:
- bearer: []
paths:
  /v1/hires:
    post:
      operationId: decideHire
      summary: 決定錄用；新的人在同一交易建立；可一併約定薪資、簽契約
      x-concept: DecideHire
      x-roles:
      - HR
      x-rules:
      - R11
      - R14
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideHireIn'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecideHireOut'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Blocked'
  /v1/hires/{id}/reschedule:
