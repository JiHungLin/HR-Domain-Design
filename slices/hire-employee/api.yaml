components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: 使用者帳號對應 user_accounts（角色、客戶、Person）
  schemas:
    Result:
      type: object
      properties:
        entity_id:
          type: string
        event_id:
          type: string
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
    Warning:
      type: object
      properties:
        rule_id:
          type: string
        rule_version:
          type: string
        rule_revision:
          type: integer
        message_code:
          type: string
        warned_value: {}
    Blocked:
      type: object
      properties:
        rule_id:
          type: string
        message_code:
          type: string
        detail:
          type: string
  responses:
    Forbidden:
      description: 角色不符，或引用的資料不屬於呼叫者的客戶（R52、05_mapping D-06）
    Blocked:
      description: 違反「擋下」類規則（資料矛盾、流程規則、R52、R55），或狀態不允許這個動作（P1）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Blocked'
