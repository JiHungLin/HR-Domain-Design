components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: 使用者帳號對應 user_accounts（角色、客戶、Person）
  schemas:
    Nationality:
      type: object
      additionalProperties: false
      properties:
        country_code: *id004
        acquired_on: *id005
        lost_on: *id005
      required:
      - country_code
      - acquired_on
    CivilRegistration:
      type: object
      additionalProperties: false
      properties:
        jurisdiction_id: *id002
        registered_on: *id005
        deregistered_on: *id005
      required:
      - jurisdiction_id
      - registered_on
    OldAgeBenefit:
      type: object
      additionalProperties: false
      properties:
        scheme_code: *id006
        received_on: *id005
      required:
      - scheme_code
      - received_on
    Contact:
      type: object
      additionalProperties: false
      properties:
        phone: *id004
        email: *id004
    PersonIn:
      type: object
      additionalProperties: false
      properties:
        legal_name: *id004
        gender: *id006
        birth_date: *id005
        education: *id004
        address: *id004
        nationalities:
          type: array
          items:
            $ref: '#/components/schemas/Nationality'
        civil_registrations:
          type: array
          items:
            $ref: '#/components/schemas/CivilRegistration'
        old_age_benefits_received:
          type: array
          items:
            $ref: '#/components/schemas/OldAgeBenefit'
        contact:
          $ref: '#/components/schemas/Contact'
      required:
      - legal_name
      description: Person 的屬性（05_mapping 1.2）；contact 存到 person_contacts（P2 C）
    PersonRef:
      type: object
      additionalProperties: false
      properties:
        person_id: *id002
        person:
          $ref: '#/components/schemas/PersonIn'
      description: 已有的人給 person_id（回任，UC-12）；新的人給 person；兩者擇一
    Allowance:
      type: object
      additionalProperties: false
      properties:
        name: *id004
        category: *id006
        amount: &id007
          type: string
          pattern: ^-?\d+(\.\d+)?$
          description: 十進位金額，以字串傳遞避免浮點誤差
      required:
      - name
      - category
      - amount
    CompensationIn:
      type: object
      additionalProperties: false
      properties:
        effective_from: *id005
        currency: &id012
          type: string
          description: 例：TWD
        pay_basis: *id006
        monthly_base_salary: *id007
        fixed_monthly_allowances: &id013
          type: array
          items:
            $ref: '#/components/schemas/Allowance'
      required:
      - effective_from
      - currency
      - pay_basis
      - monthly_base_salary
    ContractIn:
      type: object
      additionalProperties: false
      properties:
        contract_type: *id006
        fixed_term_nature: *id006
        term_start: *id005
        term_end: &id011
          type: string
          format: date
          description: 契約上寫的迄日；沒寫就不填（02 D-36）
        in_writing: *id008
      required:
      - contract_type
      - in_writing
    ApprovalIn:
      type: object
      additionalProperties: false
