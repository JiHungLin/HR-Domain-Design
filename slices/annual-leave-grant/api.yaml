      x-concept: NotifyLeaveReassessment
      x-roles:
      - HR
      - EMPLOYER
      parameters:
      - name: employer_id
        in: query
        required: false
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      - name: employment_id
        in: query
        required: false
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      - name: root_event_id
        in: query
        required: false
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      - name: since
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/leave-reassessment-notices/{id}:
    get:
      operationId: getLeaveReassessmentNotice
      summary: 一份重新判定的通知
      x-concept: NotifyLeaveReassessment
      x-roles:
      - HR
      - EMPLOYER
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeView'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/company-policies/{id}:
    get:
      operationId: getCompanyPolicy
      summary: 一條公司規定：各版本與 R78 警告
      x-concept: CompanyPolicy
      x-roles:
      - HR
      - EMPLOYER
      x-rules:
      - R78
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/leave-types:
    get:
      operationId: listLeaveTypes
      summary: 假別（全平台參考資料）
      x-concept: LeaveType
      x-roles:
      - HR
      - EMPLOYER
      - EMPLOYEE
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveTypeList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: 使用者帳號對應 user_accounts（角色、客戶、Person）
  schemas:
    Warning:
      type: object
      additionalProperties: false
      properties:
        rule_id:
          type: string
        rule_version:
          type: string
          description: 規則版本；版本欄為「—」的規則填規則所在的 04 凍結版本（05_mapping D-29，同 hire-employee D-20）
        rule_revision:
          type: integer
        message_code:
          type: string
          description: 代碼見 05_mapping 2.3（D-30）
        subject:
          $ref: '#/components/schemas/SubjectRef'
        warned_value: {}
      required:
      - rule_id
      - rule_version
      - rule_revision
      - message_code
      description: 提醒類規則；可用 hire-employee 的 OverrideWarning 忽略（R78 除外）
    SubjectRef:
      type: object
      additionalProperties: false
      properties:
        collection:
          type: string
        id:
          type: string
          pattern: ^[0-9a-f]{24}$
        field:
          type: string
      required:
      - collection
      - id
    Blocked:
      type: object
      additionalProperties: false
      properties:
        rule_id:
          type: string
        message_code:
          type: string
        detail:
          type: string
      required:
      - message_code
    Superseded:
      type: object
      additionalProperties: false
      properties:
        message_code:
          type: string
        discarded_by_id:
          type:
          - string
          - 'null'
          pattern: ^[0-9a-f]{24}$
          description: 取代它的那一筆轉換；重算後差額為 0、沒有新的一筆時為 null（05_mapping D-23）
      required:
      - message_code
      - discarded_by_id
      description: 待確認的轉換已被重算取代（Discarded）
    EvidenceIn:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
        attachment_ref:
          type: string
      required:
      - kind
    RuleVersionRef:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - RULE
          - COMPANY_POLICY
        rule_id:
          type: string
        policy_id:
          type: string
          pattern: ^[0-9a-f]{24}$
        version:
          type: string
        revision:
          type: integer
      required:
      - kind
      - version
      - revision
    MonthDay:
      type: object
      additionalProperties: false
      properties:
        month:
          type: integer
          minimum: 1
          maximum: 12
        day:
          type: integer
          minimum: 1
          maximum: 31
      required:
      - month
      - day
    WriteResult:
      type: object
      additionalProperties: false
      properties:
        event_id:
          type: string
          pattern: ^[0-9a-f]{24}$
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        reassessment_notice_ids:
          type: array
          items:
            type: string
            pattern: ^[0-9a-f]{24}$
      required:
      - event_id
      - warnings
      - reassessment_notice_ids
      description: 每個寫入動作共同的回應欄位
    BackfillEntitlementIn:
      type: object
      additionalProperties: false
      properties:
        employment_id:
          type: string
          pattern: ^[0-9a-f]{24}$
        leave_type_code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*\.[A-Z0-9_]+$
        source:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*\.[A-Z0-9_]+$
        policy_id:
          type: string
          pattern: ^[0-9a-f]{24}$
          description: source 為公司規定時必填
        origin:
          type: string
          enum:
          - ENTITLEMENT_ORIGIN.REGISTERED_CURRENT
          - ENTITLEMENT_ORIGIN.REGISTERED_DEFERRED
        quantity:
          type: string
          pattern: ^-?\d+(\.\d+)?$
          description: 數量（Decimal128 以字串傳）
        unit:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*\.[A-Z0-9_]+$
        pre_system_used_quantity:
          type: string
          pattern: ^-?\d+(\.\d+)?$
          description: 數量（Decimal128 以字串傳）
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
        registered_original_year_end:
          type: string
          format: date
          description: 補登遞延的必填（R97）
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceIn'
      required:
      - employment_id
      - leave_type_code
      - source
      - origin
      - quantity
      - unit
      - pre_system_used_quantity
      - valid_from
      - valid_to
    BackfillEntitlementOut:
      type: object
      additionalProperties: false
      properties:
        event_id:
          type: string
          pattern: ^[0-9a-f]{24}$
        entitlement_id:
          type: string
          pattern: ^[0-9a-f]{24}$
        status:
          type: string
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
      required:
      - event_id
      - entitlement_id
      - status
      - warnings
    RecordNoticeIn:
      type: object
      additionalProperties: false
      properties:
        notified_on:
          type: string
          format: date
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceIn'
      required:
      - notified_on
    NoticeOut:
      type: object
      additionalProperties: false
      properties:
        event_id:
          type: string
          pattern: ^[0-9a-f]{24}$
        entitlement_id:
          type: string
          pattern: ^[0-9a-f]{24}$
        notified_on:
          type: string
          format: date
        notice_due_on:
          type: string
          format: date
        notice_status:
          $ref: '#/components/schemas/NoticeStatus'
        recorded_at:
          type: string
          format: date-time
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
      required:
      - event_id
      - entitlement_id
      - notified_on
      - notice_due_on
      - notice_status
      - recorded_at
      - warnings
    NoticeStatus:
      type: string
      enum:
      - NOTICE_STATUS.PENDING
      - NOTICE_STATUS.NOTIFIED
      - NOTICE_STATUS.OVERDUE
      - NOTICE_STATUS.NOTIFIED_LATE
      - NOT_APPLICABLE
      - INSUFFICIENT_DATA
      description: R81 決策表；不判定的那一筆為 NOT_APPLICABLE，取得日未知為 INSUFFICIENT_DATA（core R60）
    YearAgreementIn:
      type: object
      additionalProperties: false
      properties:
        employment_id:
          type: string
          pattern: ^[0-9a-f]{24}$
        leave_type_code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*\.[A-Z0-9_]+$
        leave_year_basis:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*\.[A-Z0-9_]+$
        year_start:
          $ref: '#/components/schemas/MonthDay'
        effective_from:
          type: string
          format: date
        agreed_on:
          type: string
          format: date
        agreement_note:
          type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceIn'
      required:
      - employment_id
      - leave_type_code
      - leave_year_basis
      - effective_from
      - agreed_on
    EndYearAgreementIn:
      type: object
      additionalProperties: false
      properties:
        ended_from:
          type: string
          format: date
          description: 終止日（EndLeaveYearAgreement 的生效時間）
        agreed_on:
          type: string
          format: date
        agreement_note:
          type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceIn'
      required:
      - ended_from
      - agreed_on
    YearAgreementOut:
      type: object
      additionalProperties: false
      properties:
        event_id:
          type: string
          pattern: ^[0-9a-f]{24}$
        leave_year_agreement_id:
          type: string
          pattern: ^[0-9a-f]{24}$
        status:
          type: string
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        reassessment_notice_ids:
          type: array
          items:
            type: string
            pattern: ^[0-9a-f]{24}$
      required:
      - event_id
      - leave_year_agreement_id
      - status
      - warnings
      - reassessment_notice_ids
    PolicyParams:
      type: object
      additionalProperties: false
      properties:
        company_extra_days:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              from_months:
                type: integer
              to_months:
                type: integer
                description: 不含；空白＝以上
              days:
                type: string
                pattern: ^-?\d+(\.\d+)?$
                description: 數量（Decimal128 以字串傳）
            required:
            - from_months
            - days
        company_extra_eligibility:
          type: object
          additionalProperties: false
          properties:
            employee_categories:
              type: array
              items:
                type: string
                pattern: ^[A-Z][A-Z0-9_]*\.[A-Z0-9_]+$
        company_extra_year_end_treatment:
          type: string
          enum:
          - CONVERSION_TARGET.WAGES
          - CONVERSION_TARGET.FORFEITED
        company_extra_deferrable:
          type: boolean
        company_default_leave_year:
          type: object
          additionalProperties: false
          properties:
            leave_year_basis:
              type: string
              pattern: ^[A-Z][A-Z0-9_]*\.[A-Z0-9_]+$
            year_start:
              $ref: '#/components/schemas/MonthDay'
          required:
          - leave_year_basis
        fixed_start_year_method:
          type: string
          enum:
          - FIXED_START_YEAR_METHOD.EXTEND_TO_YEAR_END
          - FIXED_START_YEAR_METHOD.PRORATED
          description: 事項為特休年度預設的版本才有；沒有時用 rule_versions（R70）的值（05_mapping 3.2、D-31）
      description: 參數名稱照 04 參數表；沒有給的欄位＝那一版沒有寫（04 R79 決策表），不補預設值
    EstablishPolicyIn:
      type: object
      additionalProperties: false
      properties:
        employer_id:
          type: string
          pattern: ^[0-9a-f]{24}$
        leave_type_code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*\.[A-Z0-9_]+$
        name:
          type: string
        subject:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*\.[A-Z0-9_]+$
        source_note:
          type: string
        effective_from:
          type: string
          format: date
        first_version:
          $ref: '#/components/schemas/PolicyParams'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceIn'
      required:
      - name
      - subject
      - effective_from
      - first_version
    PolicyVersionIn:
      type: object
      additionalProperties: false
      properties:
        effective_from:
          type: string
          format: date
          description: 新版本的生效日；修訂時省略，沿用被修訂的那一版
        params:
          $ref: '#/components/schemas/PolicyParams'
        corrects_version:
          type: string
          description: 修訂（登錄錯誤）時填被修訂的版本；只限人資，觸發重新判定（05_mapping D-19）
        source_note:
          type: string
        reason:
          type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceIn'
      required:
      - params
    RepealPolicyIn:
      type: object
      additionalProperties: false
      properties:
        effective_to:
          type: string
          format: date
          description: 廢止日
        source_note:
          type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceIn'
      required:
      - effective_to
    PolicyWriteOut:
      type: object
      additionalProperties: false
      properties:
        event_id:
          type: string
          pattern: ^[0-9a-f]{24}$
        policy_id:
          type: string
          pattern: ^[0-9a-f]{24}$
        version:
          type: string
        revision:
          type: integer
        status:
          type: string
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        reassessment_queued:
          type: integer
          description: 寫進重新判定佇列的僱傭關係數（05_mapping D-18）
      required:
      - event_id
      - policy_id
      - status
      - warnings
      - reassessment_queued
    DeferralIn:
      type: object
      additionalProperties: false
      properties:
        entitlement_id:
          type: string
          pattern: ^[0-9a-f]{24}$
        agreed_on:
          type: string
          format: date
        deferred_quantity:
          type: string
          pattern: ^-?\d+(\.\d+)?$
          description: 數量（Decimal128 以字串傳）
        agreement_note:
          type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceIn'
      required:
      - entitlement_id
      - agreed_on
      - deferred_quantity
    AmendDeferralIn:
      type: object
      additionalProperties: false
      properties:
        agreed_on:
          type: string
          format: date
          description: 新的協商日
        deferred_quantity:
          type: string
          pattern: ^-?\d+(\.\d+)?$
          description: 數量（Decimal128 以字串傳）
        agreement_note:
          type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceIn'
      required:
      - agreed_on
      - deferred_quantity
    WithdrawDeferralIn:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceIn'
      required:
      - reason
    DeferralOut:
      type: object
      additionalProperties: false
      properties:
        event_id:
          type: string
          pattern: ^[0-9a-f]{24}$
        deferral_agreement_id:
          type: string
          pattern: ^[0-9a-f]{24}$
        status:
          type: string
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        reassessment_notice_ids:
          type: array
          items:
            type: string
            pattern: ^[0-9a-f]{24}$
      required:
      - event_id
      - deferral_agreement_id
      - status
      - warnings
      - reassessment_notice_ids
    ConfirmConversionIn:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          description: 人資處理過的事（已休、遞延協商、告知日）
        recoveries:
          type: array
          items:
            $ref: '#/components/schemas/RecoveryIn'
          description: 負數差額可以在確認時一起登錄的收回紀錄（同 POST /recoveries）；還有效的合計要等於這一筆的天數（R101，RECOVERY_NOT_COVERED）；正數、失效的不能帶
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceIn'
      required:
      - reason
    RecoveryIn:
      type: object
      additionalProperties: false
      properties:
        method:
          type: string
          enum:
          - RECOVERY_METHOD.PAYROLL_DEDUCTION
          - RECOVERY_METHOD.REPAYMENT_AGREED
          - RECOVERY_METHOD.REPAID
          - RECOVERY_METHOD.REFUSED
          - RECOVERY_METHOD.DEFERRAL_DECLINED
          description: 收回方式（04 RECOVERY_METHOD）；OFFSET_BY_REJUDGE 只由重新判定建立，不能登錄
        quantity:
          type: string
          pattern: ^\d+(\.\d+)?$
          description: 這筆回應涵蓋的天數（大於 0）
        responded_on:
          type: string
          format: date
          description: 員工簽書面同意、約定、退回或表示拒絕的日子
        evidence_note:
          type: string
          description: 同意書、退回約定、匯款或收據、溝通紀錄的說明（同意的天數與簽署日要相符）
        replaces_recovery_id:
          type: string
          pattern: ^[0-9a-f]{24}$
          description: 取代先前的哪一筆（員工改口、約定的退回實際收到、系統外追回）
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceIn'
      required:
      - method
      - quantity
      - responded_on
      - evidence_note
    RecoveryOut:
      type: object
      additionalProperties: false
      properties:
        event_id:
          type: string
          pattern: ^[0-9a-f]{24}$
        recovery_id:
          type: string
          pattern: ^[0-9a-f]{24}$
        conversion_id:
          type: string
          pattern: ^[0-9a-f]{24}$
        deferral_added_quantity:
          type: string
          pattern: ^-?\d+(\.\d+)?$
          description: 這次因此建立或增加的遞延天數（04 R103）；沒有時為 0
        deferred_in_entitlement_id:
          type:
          - string
          - 'null'
          pattern: ^[0-9a-f]{24}$
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        reassessment_notice_ids:
          type: array
          items:
            type: string
            pattern: ^[0-9a-f]{24}$
          description: 改成從薪資扣回時通知人資與雇主的那一份（04 R103）
      required:
      - event_id
      - recovery_id
      - conversion_id
      - deferral_added_quantity
      - warnings
    RecoveryView:
      type: object
      additionalProperties: false
      properties:
        recovery_id:
          type: string
          pattern: ^[0-9a-f]{24}$
        conversion_id:
          type: string
          pattern: ^[0-9a-f]{24}$
        employment_id:
          type: string
          pattern: ^[0-9a-f]{24}$
        method:
          type: string
          pattern: ^RECOVERY_METHOD\.[A-Z_]+$
