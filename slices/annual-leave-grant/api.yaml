# annual-leave-grant ⑤ API（OpenAPI 3.1）
openapi: 3.1.0
info:
  title: annual-leave-grant API
  version: 0.4.0
  description: 依 slices/annual-leave-grant/05_mapping.md 產生的設計文件，不是實作。請求與回應寫到欄位層級；每支 API 標 x-concept（概念，P8）、x-roles（誰可以做）、x-rules（檢查的規則）。所有寫入在一個多文件交易中寫入 events 與受影響的集合，先更新 leave_locks、先處理那段僱傭關係的重新判定佇列（05_mapping
    D-05、D-18），並檢查每個引用屬於呼叫者的客戶、存在且為目前版本（hire-employee 05_mapping D-06）。更正、註銷、警告忽略沿用 hire-employee 的 /v1/corrections、/v1/annulments、/v1/warning-overrides（05_mapping D-11）。給予、年度終結、開始適用與廢止生效、法令修正補足由每日排程產生，沒有 API（05_mapping
    D-03）。
servers:
- url: https://{host}
  variables:
    host:
      default: hr.example.local
security:
- bearer: []
paths:
  /v1/leave-entitlements/backfill:
    post:
      operationId: registerExistingLeaveEntitlement
      summary: 補登開始由系統管理那天仍可休的一筆特休（每次一筆）
      x-concept: RegisterExistingLeaveEntitlement
      x-roles:
      - HR
      x-rules:
      - R97
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackfillEntitlementIn'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackfillEntitlementOut'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Blocked'
  /v1/leave-entitlements/{id}/notices:
    post:
      operationId: recordLeaveNotice
      summary: 登錄雇主實際告知排定特休的日期；回應告知狀態與期限
      x-concept: RecordLeaveNotice
      x-roles:
      - HR
      - EMPLOYER
      x-rules:
      - R80
      - R81
      - R98
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordNoticeIn'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeOut'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Blocked'
  /v1/leave-year-agreements:
    post:
      operationId: recordLeaveYearAgreement
      summary: 登錄特休年度約定；適用起日早於已給予的取得日時同一交易重新判定
      x-concept: RecordLeaveYearAgreement
      x-roles:
      - HR
      x-rules:
      - R72
      - R75
      - R98
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YearAgreementIn'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YearAgreementOut'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Blocked'
    get:
      operationId: listLeaveYearAgreements
      summary: 特休年度約定
      x-concept: LeaveYearAgreement
      x-roles:
      - HR
      - EMPLOYER
      parameters:
      - name: employment_id
        in: query
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YearAgreementList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/leave-year-agreements/{id}/end:
    post:
      operationId: endLeaveYearAgreement
      summary: 終止特休年度約定（之後套用雇主預設）
      x-concept: EndLeaveYearAgreement
      x-roles:
      - HR
      x-rules:
      - R75
      - R98
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndYearAgreementIn'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YearAgreementOut'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Blocked'
  /v1/company-policies:
    post:
      operationId: establishCompanyPolicy
      summary: 訂定公司規定（含第一版內容）；影響的僱傭關係寫進重新判定佇列
      x-concept: EstablishCompanyPolicy
      x-roles:
      - HR
      - EMPLOYER
      x-rules:
      - R73
      - R76
      - R78
      - R98
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstablishPolicyIn'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyWriteOut'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Blocked'
    get:
      operationId: listCompanyPolicies
      summary: 公司規定
      x-concept: CompanyPolicy
      x-roles:
      - HR
      - EMPLOYER
      parameters:
      - name: employer_id
        in: query
        required: false
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      - name: subject
        in: query
        required: false
        schema:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*\.[A-Z0-9_]+$
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/company-policies/{id}/versions:
    post:
      operationId: reviseCompanyPolicy
      summary: 新增公司規定的版本；帶 corrects_version 是修訂（只限人資，觸發重新判定）
      x-concept: ReviseCompanyPolicy
      x-roles:
      - HR
      - EMPLOYER
      x-rules:
      - R73
      - R76
      - R78
      - R91
      - R92
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyVersionIn'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyWriteOut'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Blocked'
  /v1/company-policies/{id}/repeal:
    post:
      operationId: repealCompanyPolicy
      summary: 廢止公司規定（廢止日在未來的到那天生效）
      x-concept: RepealCompanyPolicy
      x-roles:
      - HR
      - EMPLOYER
      x-rules:
      - R76
      - R98
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepealPolicyIn'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyWriteOut'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Blocked'
  /v1/leave-deferral-agreements:
    post:
      operationId: recordLeaveDeferral
      summary: 登錄遞延協商；那一筆已年度終結時同一交易重新判定年度終結
      x-concept: RecordLeaveDeferral
      x-roles:
      - HR
      x-rules:
      - R82
      - R83
      - R84
      - R92
      - R98
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeferralIn'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeferralOut'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Blocked'
  /v1/leave-deferral-agreements/{id}/amend:
    post:
      operationId: amendLeaveDeferral
      summary: 修改遞延協商（雙方重新談）
      x-concept: AmendLeaveDeferral
      x-roles:
      - HR
      x-rules:
      - R82
      - R83
      - R84
      - R92
      - R98
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmendDeferralIn'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeferralOut'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Blocked'
  /v1/leave-deferral-agreements/{id}/withdraw:
    post:
      operationId: withdrawLeaveDeferral
      summary: 撤回遞延協商
      x-concept: WithdrawLeaveDeferral
      x-roles:
      - HR
      x-rules:
      - R84
      - R92
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawDeferralIn'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeferralOut'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Blocked'
  /v1/leave-conversions/{id}/confirm:
    post:
      operationId: confirmLeaveConversion
      summary: 確認待確認的轉換；確認後經 outbox 交給薪資
      x-concept: ConfirmLeaveConversion
      x-roles:
      - HR
      x-rules:
      - R87
      - R92
      - R94
      - R101
      - R103
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmConversionIn'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmConversionOut'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 狀態不是待確認；負數差額的收回紀錄沒有涵蓋整筆（RECOVERY_NOT_COVERED，R101）；已被取代時回 Superseded（給 discarded_by_id；重算後差額為 0、沒有取代它的那一筆時為 null，05_mapping D-23）
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Blocked'
                - $ref: '#/components/schemas/Superseded'
  /v1/leave-conversions/{id}/recoveries:
    post:
      operationId: recordConversionRecovery
      summary: 依員工的回應登錄負數差額某幾天怎麼收回；可以取代先前一筆（員工改口、約定的退回實際收到）（03_flows D-22）
      x-concept: RecordConversionRecovery
      x-roles:
      - HR
      x-rules:
      - R87
      - R101
      - R103
      - R104
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryIn'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryOut'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 不是負數差額（NOT_NEGATIVE_CONVERSION）、已被取代（INVALID_STATE）、天數超過（RECOVERY_EXCEEDS_QUANTITY）、方式不能由人登錄（OFFSET_BY_REJUDGE）（R101、R103）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blocked'
  /v1/leave-conversion-recoveries:
    get:
      operationId: listConversionRecoveries
      summary: 收回紀錄清單；outstanding=true 列出拒絕返還與約定自行退回還有效的（系統外追討的名單）
      x-concept: LeaveConversionRecovery
      x-roles:
      - HR
      - EMPLOYER
      parameters:
      - name: employer_id
        in: query
        required: false
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      - name: employment_id
        in: query
        required: false
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      - name: method
        in: query
        required: false
        schema:
          type: string
          pattern: ^RECOVERY_METHOD\.[A-Z_]+$
      - name: outstanding
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryList'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/leave-entitlements/{id}/used-quantity-fixture:
    post:
      operationId: loadUsedQuantityFixture
      summary: '[靜態替代] 登錄或改正一筆特休的已休；已年度終結的同一交易重新判定'
      x-concept: LoadUsedQuantityFixture（[靜態替代] LeaveEntitlement.used_quantity）
      x-roles:
      - HR
      x-rules:
      - R92
      - R96
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsedQuantityFixtureIn'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Blocked'
  /v1/employments/{id}/ending-fixture:
    post:
      operationId: loadEmploymentEndingFixture
      summary: '[靜態替代] 載入一般離職的結束日；同一交易停止特休'
      x-concept: LoadEmploymentEndingFixture（[靜態替代] resignation 的離職）
      x-roles:
      - HR
      x-rules:
      - R02
      - R85
      - R95
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndingFixtureIn'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndingFixtureOut'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Blocked'
  /v1/employments/{id}/leave-entitlements:
    get:
      operationId: listLeaveEntitlements
      summary: 某一天這位員工有哪幾筆特休（含推導的數量、告知期限與告知狀態）
      x-concept: LeaveEntitlement
      x-roles:
      - HR
      - EMPLOYER
      x-rules:
      - R81
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      - name: 'on'
        in: query
        required: false
        schema:
          type: string
          format: date
        description: 預設今天（依雇主所在地，P4）；列出取得日不晚於這天、沒有作廢的每一筆，狀態用目前的，不看可休期間有沒有包含這天（05_mapping D-27）
      - name: leave_type_code
        in: query
        required: false
        schema:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*\.[A-Z0-9_]+$
      - name: as_of
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: 只看這個時間以前登錄的版本與事件（05_mapping D-16）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/leave-entitlements/{id}:
    get:
      operationId: getLeaveEntitlement
      summary: 一筆特休的明細：各版本、依據、年度終結的判定內容、轉換、遞延協商
      x-concept: LeaveEntitlement
      x-roles:
      - HR
      - EMPLOYER
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      - name: as_of
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: 只看這個時間以前登錄的版本與事件（05_mapping D-16）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/employments/{id}/leave-forecast:
    get:
      operationId: getLeaveForecast
      summary: 之後各期的預估（預計取得日、天數、可休期間）
      x-concept: LeaveEntitlement（預估，推導）
      x-roles:
      - HR
      - EMPLOYER
      x-rules:
      - R65
      - R66
      - R69
      - R70
      - R77
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      - name: until
        in: query
        required: true
        schema:
          type: string
          format: date
        description: 預估到哪一天
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forecast'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/employments/{id}/leave-year-basis:
    get:
      operationId: getLeaveYearBasis
      summary: 某一天適用哪一種特休年度，依約定或雇主預設
      x-concept: LeaveYearAgreement（推導：某天適用哪一種）
      x-roles:
      - HR
      - EMPLOYER
      x-rules:
      - R68
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      - name: 'on'
        in: query
        required: false
        schema:
          type: string
          format: date
        description: 預設今天
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YearBasisOut'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/employments/{id}/leave-warnings:
    get:
      operationId: listLeaveWarnings
      summary: 這位員工的法規警告、資料不足（現算）
      x-concept: 法規警告（推導）
      x-roles:
      - HR
      - EMPLOYER
      x-rules:
      - R71
      - R76
      - R81
      - R83
      - R84
      - R94
      - R96
      - R99
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveWarningsOut'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/leave-work-items:
    get:
      operationId: listLeaveWorkItems
      summary: 跨員工的待處理清單：未忽略的警告、資料不足、待確認的轉換、重新判定失敗
      x-concept: 待處理清單（推導）
      x-roles:
      - HR
      - EMPLOYER
      parameters:
      - name: employer_id
