        items:
          type: array
          items:
            $ref: '#/components/schemas/PolicyView'
      required:
      - items
    PolicyDetail:
      type: object
      additionalProperties: false
      properties:
        policy:
          $ref: '#/components/schemas/PolicyView'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/PolicyVersionView'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
      required:
      - policy
      - versions
      - warnings
      description: warnings 含 R78（公司規定少於法定；不能忽略）
    LeaveTypeList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              code:
                type: string
                pattern: ^[A-Z][A-Z0-9_]*\.[A-Z0-9_]+$
              jurisdiction_id:
                type: string
                pattern: ^[0-9a-f]{24}$
              status:
                type: string
            required:
            - code
            - status
      required:
      - items
  responses:
    Forbidden:
      description: 角色不符，或引用的資料不屬於呼叫者的客戶
    NotFound:
      description: 引用的資料不存在或不是目前版本
    Blocked:
      description: 違反「擋下」類規則，或狀態不允許這個動作（P1）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Blocked'
