        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemsOut'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/leave-conversions:
    get:
      operationId: listLeaveConversions
      summary: 轉換清單；薪資切片以 status=Determined 讀取
      x-concept: LeaveConversion
      x-roles:
      - HR
      - EMPLOYER
      parameters:
      - name: employment_id
        in: query
        required: false
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      - name: employer_id
        in: query
        required: false
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - Provisional
          - Determined
          - Discarded
      - name: payment_due_before
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversionList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/leave-reassessment-notices:
    get:
      operationId: listLeaveReassessmentNotices
