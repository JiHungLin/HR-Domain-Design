[project]
name = "hr-impl"
version = "0.1.0"
description = "hire-employee 切片的實作（MongoDB＋FastAPI），依 slices/hire-employee/05_mapping.md、schema.mongo.js、api.yaml"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pymongo>=4.9",
  "pyyaml>=6.0",
  "jsonschema>=4.26.0",
  "rfc3339-validator>=0.1.4",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
